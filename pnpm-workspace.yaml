packages:
  - "packages/*"
  - "packages/plugins/*"

onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
  - node-pty

# Build tooling (electron-builder → app-builder-lib / @electron/rebuild / node-gyp) pins tar 6, which has an open
# decompression-DoS advisory (fixed in 7.5.21) that Dependabot can't bump past 6.2.1. These only unpack archives while
# packaging / rebuilding native modules — nothing in the shipped app — and use tar's x / extract / create, which 7 keeps.
overrides:
  tar: ">=7.5.21"
  # Transitive fixes: dockerode pins uuid 10 (buffer bounds check, fixed in 14); @azure/identity pulls msal-node 6.
  "uuid@<14": "^14.0.3"
  "@azure/msal-node": ">=7.1.1"
  katex: ">=0.19.1"
