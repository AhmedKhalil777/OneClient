<!doctype html>
<!-- Source of images/social-preview.png (1280×640): the card GitHub and social networks show for links to the repository.
     Regenerate: open this file in a browser at 1280×640 and screenshot it. -->
<html lang="en"><head><meta charset="utf-8"><title>oneClient social preview</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1280px;height:640px;overflow:hidden}
  body{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#e9edf4;background:#0b0d12;position:relative}
  .glow{position:absolute;inset:0;background:radial-gradient(900px 500px at 78% -10%,rgba(111,141,255,.34),transparent 60%),radial-gradient(700px 420px at 5% 110%,rgba(162,131,255,.22),transparent 60%)}
  .left{position:absolute;left:72px;top:64px;width:620px}
  .brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:30px;letter-spacing:-.02em}
  .brand img{width:46px;height:46px}
  h1{font-size:57px;line-height:1.04;letter-spacing:-.035em;font-weight:800;margin-top:44px}
  h1 span{background:linear-gradient(120deg,#6f8dff,#a283ff 55%,#e879f9);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin-top:24px;font-size:24px;line-height:1.4;color:#98a2b3;max-width:520px}
  .tags{position:absolute;left:72px;bottom:56px;display:flex;gap:10px;flex-wrap:wrap;width:560px}
  .tags b{font-weight:600;font-size:17px;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#cdd5e2}
  .shot{position:absolute;left:760px;top:96px;width:640px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.16);box-shadow:0 40px 90px -20px rgba(0,0,0,.8)}
  .shot .bar{height:30px;background:#181c26;display:flex;align-items:center;gap:7px;padding-left:12px}
  .shot .bar i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.shot .bar i:nth-child(2){background:#febc2e}.shot .bar i:nth-child(3){background:#28c840}
  .shot img{display:block;width:640px}
</style></head><body>
<div class="glow"></div>
<div class="left">
  <div class="brand"><img src="../packages/core/resources/logo.svg" alt="">oneClient</div>
  <h1>One client for your <span>whole backend stack.</span></h1>
  <p>PostgreSQL · SQL Server · MySQL · Kafka · Redis · Docker · REST. Free, open source, extensible.</p>
</div>
<div class="tags"><b>VS Code-style</b><b>Desktop &amp; browser</b><b>Plugin API</b><b>MIT</b></div>
