# Publishes the marketing site (site/ + docs/images + logo and plugin icons, assembled by scripts/build-site.mjs)
# to GitHub Pages whenever any of it changes on main.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "packages/core/resources/logo.svg"
      - "packages/plugins/*/icon.svg"
      - "scripts/build-site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
