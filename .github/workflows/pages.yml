# Publishes the marketing site (site/ + docs/images + logo and plugin icons, assembled by scripts/build-site.mjs)
# to GitHub Pages whenever any of it changes on main.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "packages/core/resources/logo.svg"
      - "packages/plugins/*/icon.svg"
      - "scripts/build-site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: node scripts/build-site.mjs

      # Pages must be enabled once (Settings → Pages → Source: GitHub Actions). The workflow token can't do that, but a
      # PAGES_TOKEN secret (fine-grained PAT, this repo, "Administration: write" + "Pages: write") lets this step enable it.
      - name: Check Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.PAGES_TOKEN || github.token }}
          HAS_ADMIN_TOKEN: ${{ secrets.PAGES_TOKEN != '' }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "404" ] && [ "$HAS_ADMIN_TOKEN" != "true" ]; then
            echo "::error title=GitHub Pages is not enabled::Open https://github.com/${{ github.repository }}/settings/pages, set Source to 'GitHub Actions', then re-run this workflow (or add a PAGES_TOKEN secret so it can enable Pages itself)."
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: ${{ secrets.PAGES_TOKEN != '' }}
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
