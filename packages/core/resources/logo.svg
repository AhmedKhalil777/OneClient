<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="oc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f8fff"/>
      <stop offset="1" stop-color="#6b4dff"/>
    </linearGradient>
    <linearGradient id="oc-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#oc-bg)"/>
  <!-- orbit: the tools one client connects to -->
  <circle cx="128" cy="132" r="78" fill="none" stroke="url(#oc-ring)" stroke-width="9"/>
  <!-- spokes from the "1" to each tool -->
  <path d="M128 132 L195.5 93 M128 132 L60.5 93 M128 132 L128 210" stroke="#ffffff" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round"/>
  <!-- the "1" -->
  <path d="M106 92 L138 70 V182" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M110 186 H166" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <!-- tool nodes -->
  <circle cx="195.5" cy="93" r="15" fill="#ffd166" stroke="#ffffff" stroke-width="5"/>
  <circle cx="60.5" cy="93" r="15" fill="#06d6a0" stroke="#ffffff" stroke-width="5"/>
  <circle cx="128" cy="210" r="15" fill="#ff6b9a" stroke="#ffffff" stroke-width="5"/>
</svg>
