<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sample Dashboard</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        background: #1e1e1e;
        color: #ccc;
      }
      #ticks div {
        font-family: monospace;
        font-size: 12px;
        color: #8a8a8a;
      }
    </style>
  </head>
  <body>
    <h1>Tier 2 test view</h1>
    <div id="status">connecting…</div>
    <div id="ticks"></div>
    <script>
      const statusEl = document.getElementById("status");
      const ticksEl = document.getElementById("ticks");

      window.oneclientView.onMessage((msg) => {
        if (msg.type === "pong") {
          statusEl.textContent = `connected (connectionId=${msg.connectionId})`;
        } else if (msg.type === "tick") {
          const row = document.createElement("div");
          row.textContent = `tick #${msg.count} (pushed asynchronously from the backend)`;
          ticksEl.prepend(row);
        }
      });

      window.oneclientView.postMessage({ type: "ping" });
      window.oneclientView.postMessage({ type: "subscribe" });
    </script>
  </body>
</html>
